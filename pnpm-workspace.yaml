packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de instalacion permitidos. Se listan de forma explicita en lugar de
# habilitarlos en bloque: cada entrada es una decision consciente.
allowBuilds:
  # esbuild descarga su binario nativo en el postinstall. Lo necesitan Vite y
  # Vitest para arrancar.
  esbuild: true
  # Mensaje promocional en consola. No aporta nada al arranque.
  '@nestjs/core': false
  # Telemetria de analitica de paquetes. No la queremos.
  '@scarf/scarf': false
  # Acelerador nativo de msgpackr, que usa BullMQ para serializar los trabajos.
  # Requiere cadena de compilacion C++ y tiene alternativa en JavaScript puro;
  # el coste de compilarlo en cada maquina no compensa para una cola con unos
  # pocos recalculos por hora.
  msgpackr-extract: false
